    <rect x="128" y="128" width="82" height="82" rx="7"/>
    <rect x="300" y="128" width="82" height="82" rx="7"/>
    <rect x="214" y="214" width="82" height="82" rx="7"/>
    <rect x="128" y="300" width="82" height="82" rx="7"/>
    <rect x="300" y="300" width="82" height="82" rx="7"/>
  </g>
  <g fill="#ffffff" opacity="0.26">
    <rect x="214" y="128" width="82" height="82" rx="7"/>
    <rect x="128" y="214" width="82" height="82" rx="7"/>
    <rect x="300" y="214" width="82" height="82" rx="7"/>
    <rect x="214" y="300" width="82" height="82" rx="7"/>
  </g>
</svg>
