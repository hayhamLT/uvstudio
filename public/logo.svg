<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="uvbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#1183d6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#uvbg)"/>
